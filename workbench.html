<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渡柜 · 工作台设计样稿</title>
<style>
:root{--ink:#212d2a;--mut:#53625c;--line:#d6dbd3;--paper:#fffefa;--green:#205745;--wash:#e0eee6;color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;background:#f4f3ee}*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:5px 11px}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}header{border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;padding:0 4vw;gap:18px;background:var(--paper)}.logo{width:24px;height:22px;position:relative}.logo:before,.logo:after{content:"";position:absolute;width:12px;height:16px;border:2px solid var(--green);top:0;left:0}.logo:after{left:10px;top:4px;background:var(--paper)}header strong{font-size:20px;letter-spacing:2px}.mono,code,.size{font-family:Consolas,monospace}.muted,small{color:var(--mut)}header small{margin-left:auto}main{max-width:1600px;margin:auto;padding:32px 4vw}h1{font-size:25px;font-weight:600;margin:4px 0 20px}h2{margin:4px 0;font-size:22px}.kicker{font:12px Consolas,monospace;color:var(--mut);letter-spacing:.13em}.shelf{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:11px 16px;background:#e8ebe3;border-top:1px solid var(--line);font-size:13px}.panes{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border:1px solid var(--line)}article{min-width:0;padding:22px}article+article{border-left:1px solid var(--line)}.meta,.bar,.foot{display:flex;justify-content:space-between;align-items:center;gap:8px}.state{color:var(--green);font-size:12px}.path{display:block;margin:10px 0 15px;overflow-wrap:anywhere}.bar{justify-content:flex-start;border-top:1px solid var(--line);padding:12px 0}.primary{background:var(--green);border-color:var(--green);color:white}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border-bottom:1px solid #e6e9e3;text-align:left;height:41px;font-weight:400}th{height:32px;font-size:12px;color:var(--mut)}th:first-child{width:30px}th:last-child{width:78px}td:last-child,th:last-child{text-align:right}.name{overflow-wrap:anywhere}.name:before{content:"";border:1.4px solid #86938a;border-radius:1px;width:9px;height:12px;display:inline-block;margin:0 10px}.folder:before{width:14px;height:9px;border-color:#8e7958;background:#eee6d6}tr.selected td{background:var(--wash)}input{accent-color:var(--green)}.foot{color:var(--mut);font-size:12px;margin-top:14px}.history{border-top:2px solid var(--ink);margin-top:24px;background:var(--paper);padding:14px 18px}.history h3{font-size:15px;margin:0 0 8px}.history p{margin:6px 0;overflow-wrap:anywhere}footer{margin-top:16px;color:var(--mut);font-size:12px}dialog{color:var(--ink);border:1px solid var(--line);border-radius:4px;background:var(--paper);padding:24px;width:min(450px,92vw)}dialog::backdrop{background:#14251e50}dialog h2{font-size:18px}dialog p{white-space:pre-line;overflow-wrap:anywhere}dialog form{display:flex;justify-content:flex-end;gap:8px}@media(max-width:759px){main{padding:20px 12px}.panes{grid-template-columns:1fr}article{padding:16px}article+article{border-left:0;border-top:1px solid var(--line)}header{gap:10px}.brandlatin{display:none}}
</style>
<header><span class="logo" aria-hidden="true"></span><strong>渡柜</strong><span class="kicker brandlatin">DOCKROOM</span><small>内部工具设计稿　/　01</small></header>
<main><div class="kicker">OPERATIONS　/　FILES</div><h1>文件工作台</h1><div class="shelf"><b>剪贴板</b><span id="clip" aria-live="polite">空 · 选择文件后复制</span></div><section class="panes" id="panes" aria-label="双栏目录"></section><section class="history"><h3>本次操作记录</h3><div id="logs" aria-live="polite"><span class="muted">尚无操作</span></div></section><footer>交互样稿 · 可在任一栏勾选、复制并到另一栏粘贴。删除和撤回仅演示内存状态；刷新即可复位，不访问磁盘。</footer></main>
<dialog id="confirm"><h2 id="heading"></h2><p id="detail"></p><form method="dialog"><button value="cancel" autofocus>取消</button><button class="primary" value="ok" id="yes"></button></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), hosts=['studio-07','archive-01'], paths=['D:\\交付\\十一月','/srv/archive/2026'], systems=['Windows · 制作机','Linux · 归档机'];
const rows=[[['印刷稿','目录'],['封面修订.tif','186 MiB'],['索引清单.csv','24 KiB'],['排版说明.pdf','3.6 MiB']],[['十月归档','目录'],['样张','目录'],['交接说明.txt','2 KiB']]];
let clip=null, pending=null, first=true; const picked=[new Set(),new Set()],trash=[[],[]];picked[0].add('封面修订.tif');
function log(s){if(first){$('logs').replaceChildren();first=false}const p=document.createElement('p');p.textContent=s;$('logs').prepend(p)}
function ask(title,text,label,action){$('heading').textContent=title;$('detail').textContent=text;$('yes').textContent=label;pending=action;$('confirm').returnValue='cancel';$('confirm').showModal()}
$('confirm').addEventListener('close',()=>{if($('confirm').returnValue==='ok'&&pending)pending();pending=null;draw()});
function draw(){const pane=$('panes');pane.replaceChildren();$('clip').textContent=clip?`${hosts[clip.i]}　·　${clip.items.length} 项　/　${paths[clip.i]}`:'空 · 选择文件后复制';hosts.forEach((host,i)=>{const a=document.createElement('article');a.innerHTML=`<div class="meta"><span class="kicker">PANE　0${i+1}</span><span class="state">● 在线</span></div><h2 class="mono">${host}</h2><span class="muted">${systems[i]}</span><code class="path">${paths[i]}</code><div class="bar"><button data-act="copy">复制</button><button data-act="paste" class="primary">粘贴到此处</button><button data-act="trash">删除</button></div><table aria-label="${host} 文件"><thead><tr><th></th><th>名称</th><th>大小</th></tr></thead><tbody></tbody></table><div class="foot"><span class="count"></span><button data-act="restore">撤回上次删除</button></div>`;pane.append(a);
const act=k=>a.querySelector(`[data-act="${k}"]`), count=a.querySelector('.count');function state(){act('copy').disabled=act('trash').disabled=!picked[i].size;act('paste').disabled=!clip||clip.i===i;act('restore').disabled=!trash[i].length;count.textContent=`${rows[i].length} 项　/　已选 ${picked[i].size}`}
for(const item of rows[i]){const [name,size]=item,tr=a.querySelector('tbody').insertRow(),check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label','选择 '+name);check.checked=picked[i].has(name);tr.classList.toggle('selected',check.checked);tr.insertCell().append(check);const n=tr.insertCell();n.textContent=name;n.className='name'+(size==='目录'?' folder':'');const s=tr.insertCell();s.className='size';s.textContent=size==='目录'?'—':size;check.onchange=()=>{if(check.checked)picked[i].add(name);else picked[i].delete(name);tr.classList.toggle('selected',check.checked);state()}}
act('copy').onclick=()=>{clip={i,items:rows[i].filter(([n])=>picked[i].has(n)).map(x=>[...x])};draw()};act('paste').onclick=()=>ask('确认复制',`从　${hosts[clip.i]} · ${paths[clip.i]}\n到　${host} · ${paths[i]}\n\n${clip.items.map(x=>x[0]).join('、')}\n同名项目将跳过。`,'开始复制',()=>{let ok=0;for(const item of clip.items){if(rows[i].some(x=>x[0]===item[0]))continue;rows[i].push([...item]);ok++}log(`${hosts[clip.i]} → ${host}　已复制 ${ok} 项，跳过 ${clip.items.length-ok} 项（模拟）`)});
act('trash').onclick=()=>ask('移入回收站？',`${host} · ${paths[i]}\n${[...picked[i]].join('、')}`,'移入回收站',()=>{const batch=rows[i].filter(x=>picked[i].has(x[0]));trash[i].push(batch);rows[i]=rows[i].filter(x=>!picked[i].has(x[0]));picked[i].clear();if(clip&&clip.i===i)clip=null;log(`${host}　已移入回收站 ${batch.length} 项（模拟）`)});act('restore').onclick=()=>{const batch=trash[i].at(-1);if(batch.some(x=>rows[i].some(y=>x[0]===y[0]))){log(`${host}　同名项目已存在，未恢复`);return}rows[i].push(...trash[i].pop());log(`${host}　已恢复 ${batch.length} 项（模拟）`);draw()};state()})}draw();
</script></html>
